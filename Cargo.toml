[package]
name = "t4a-private-gemm-x86"
version = "0.1.30"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
description = "x86-64 matmul impl (tensor4all fork of private-gemm-x86; adds the masked-store offset clamp, a triangular-destination regression test and the diagonal reversal for negative depth strides)"
repository = "https://github.com/tensor4all/t4a-private-gemm-x86"
license = "MIT"
rust-version = "1.84.0"

[lib]
name = "private_gemm_x86"   # unchanged: callers keep `use private_gemm_x86::*`

[features]
default = [
  "std",
  "rayon",
]
std = [
  "dep:sysctl",
]
rayon = [
  "std",
  "dep:rayon",
  "dep:spindle",
  "dep:crossbeam",
]

# Exposes private kernels to `benches/microkernel.rs`. Off by default; never enable in a product.
bench-internals = []

[[bench]]
name = "microkernel"
harness = false
required-features = ["bench-internals"]

[dependencies]
raw-cpuid = "11.5.0"
crossbeam = { version = "0.8.4", optional = true }
rayon = { version = "1.10.0", optional = true }
spindle = { version = "0.2.6", optional = true }
num_cpus = "1.16.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
sysctl = { version = "0.6.0", optional = true }

[dev-dependencies]
# only what the crate's own `#[cfg(test)]` modules use; the bencher examples and the
# sibling `gemm` checkout they needed are not part of this fork
aligned-vec = "0.6.4"
bytemuck = "1.22.0"
rand = "0.9.0"
gemm = "0.19.0"          # crates.io release; the tests only need `gemm`, `c64`, `c32`

[build-dependencies]
defer = "0.2.1"
interpol = "0.2.1"

# No default profile carries debug info (tensor4all-agent-rules, rules/rust/performance.md,
# "Build Profiles And Target Hygiene"); `debug-assertions` and `overflow-checks` stay on.
[profile.dev]
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test]
debug = 0
debug-assertions = true
overflow-checks = true

# CI builds and tests with this profile (tensor4all-agent-rules, rules/common/repository.md,
# "Build Profiles"). It inherits `test`, not `release`, so the debug-mode steps of `ci.yml` keep
# testing with `debug-assertions` and `overflow-checks` on: the fixes this fork carries (the
# masked-store offset clamp, the triangular destination, the reversed depth stride) are
# out-of-bounds pointer arithmetic, and the standard library's unsafe-precondition checks and
# integer overflow checks only run with those on. The steps that need optimised code
# (`with_stack`'s 96 MiB shapes, `tests_f64::test_gemm`) keep `--release` on purpose: unoptimised they
# took 48 min (see `ci.yml`), so they test the shipped configuration and the kernels' bounds are
# covered by the debug-mode steps above.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

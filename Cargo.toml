[package]
name = "private-gemm-x86"
version = "0.1.22"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
description = "x86-64 matmul impl"
repository = "https://github.com/sarah-quinones/gemm-x64-v2/"
license = "MIT"
rust-version = "1.84.0"

[features]
default = [
  "std",
  "rayon",
]
std = [
  "dep:sysctl",
]
rayon = [
  "std",
  "dep:rayon",
  "dep:spindle",
  "dep:crossbeam",
]

[dependencies]
raw-cpuid = "11.5.0"
crossbeam = { version = "0.8.4", optional = true }
rayon = { version = "1.10.0", optional = true }
spindle = { version = "0.2.6", optional = true }
num_cpus = "1.16.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
sysctl = { version = "0.6.0", optional = true }

[build-dependencies]
defer = "0.2.1"
interpol = "0.2.1"

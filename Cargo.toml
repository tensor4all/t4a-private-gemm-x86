[package]
name = "t4a-private-gemm-x86"
version = "0.1.24"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
description = "x86-64 matmul impl (tensor4all fork of private-gemm-x86; adds the masked-store offset clamp and a triangular-destination regression test)"
repository = "https://github.com/tensor4all/t4a-private-gemm-x86"
license = "MIT"
rust-version = "1.84.0"

[lib]
name = "private_gemm_x86"   # unchanged: callers keep `use private_gemm_x86::*`

[features]
default = [
  "std",
  "rayon",
]
std = [
  "dep:sysctl",
]
rayon = [
  "std",
  "dep:rayon",
  "dep:spindle",
  "dep:crossbeam",
]

[dependencies]
raw-cpuid = "11.5.0"
crossbeam = { version = "0.8.4", optional = true }
rayon = { version = "1.10.0", optional = true }
spindle = { version = "0.2.6", optional = true }
num_cpus = "1.16.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
sysctl = { version = "0.6.0", optional = true }

[dev-dependencies]
# only what the crate's own `#[cfg(test)]` modules use; the bencher examples and the
# sibling `gemm` checkout they needed are not part of this fork
aligned-vec = "0.6.4"
bytemuck = "1.22.0"
rand = "0.9.0"
gemm = "0.19.0"          # crates.io release; the tests only need `gemm`, `c64`, `c32`

[build-dependencies]
defer = "0.2.1"
interpol = "0.2.1"

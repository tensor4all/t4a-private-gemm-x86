name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile ci --all-targets
      - name: Triangular destinations, both instruction sets
        # The test names `InstrSet` explicitly, so an AVX-512 runner covers the 256-bit path
        # (the one that used to write below the diagonal) and an AVX2-only runner covers it
        # directly. Each test prints a skip line when its instruction set is absent.
        run: cargo test --profile ci --test triangular_dst -- --nocapture
      - name: Diagonal product with reversed depth, both instruction sets
        run: cargo test --profile ci --test diag_reversed_depth -- --nocapture
      - name: Job tables borrowed from a caller-owned workspace
        run: cargo test --profile ci --test job_scratch
      - name: A warm workspace allocates nothing
        # this binary holds one `#[test]`, so no other test thread allocates while it counts
        run: cargo test --profile ci --test job_alloc -- --nocapture --test-threads=1
      - name: Packing memory from the caller, first call on a fresh thread
        # one test at a time: the tests share the allocation counter; each instruction set the
        # runner lacks is skipped with a line on stdout. Release: the 96 MiB shapes took 48 min
        # unoptimised.
        run: cargo test --release --test with_stack -- --nocapture --test-threads=1
      - name: A window of a product rounds as the whole product (#24)
        # Both instruction sets the runner has, with a skip line for each it lacks: the f64
        # AVX-512 kernel choice (`nrows > 48`) runs only on an AVX-512 runner.
        run: cargo test --profile ci --test shape_independent_rounding -- --nocapture
      - name: Classical f64/f32 packed panels and padded edges
        # the packed drivers' comparisons live in the unit tests: an integration test cannot
        # force the dispatch gate, so on a non-Haswell runner it would only test the general driver.
        # The `packed_avx2` filter selects both packed_avx2 and packed_avx2_f32.
        run: |
          cargo test --profile ci --lib packed_avx2
          cargo test --profile ci --test avx256_f64_depth
      - name: The mixed-instruction GEMM test runs its AVX256 arm
        # This test SIGILLed on AVX2-only hosts before the feature gate; running it on
        # every push is the regression guard for #16. Release keeps the scalar reference
        # affordable while the test still exercises both instruction-set branches.
        run: cargo test --release --lib tests_f64::test_gemm
      - name: Full suite
        # The crate's own suite is the author's and takes many minutes per shape; it is not
        # what this branch changed, so it runs on demand rather than on every push.
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --profile ci
